<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F8A83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PR-TOP" />
    <meta name="description" content="PR-TOP helps psychologists and coaches stay connected with clients between sessions: secure client diary, AI session notes, crisis alerts and a Telegram bot. GDPR-compliant." />
    <link rel="manifest" href="/manifest.json" />
    <title>PR-TOP — AI Assistant for Therapists & Psychologists | Client Diary, Session Notes, Telegram Bot</title>
    <!-- Fonts are self-hosted via @fontsource; imported in src/main.jsx (F6). -->
    <!-- Umami Analytics (privacy-first, cookieless, GDPR-compliant) -->
    <!-- Script served via nginx reverse proxy at /analytics/script.js to avoid AdBlock -->
    <script defer src="/analytics/script.js" data-website-id="%VITE_UMAMI_WEBSITE_ID%"></script>
    <!-- Static JSON-LD structured data (F5) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://pr-top.com/#organization",
          "name": "PR-TOP",
          "url": "https://pr-top.com",
          "logo": "https://pr-top.com/icons/icon-192.svg",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://pr-top.com/#website",
          "url": "https://pr-top.com",
          "name": "PR-TOP",
          "publisher": { "@id": "https://pr-top.com/#organization" },
          "inLanguage": ["en", "ru", "es", "uk"]
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://pr-top.com/#software",
          "name": "PR-TOP",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "Web, Telegram",
          "url": "https://pr-top.com",
          "publisher": { "@id": "https://pr-top.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-background text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

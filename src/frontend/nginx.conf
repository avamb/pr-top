# Upstream definitions for reverse proxying
#
# Re-resolve service names at runtime through Docker's embedded DNS. A static
# `server backend:3001;` is resolved once when nginx starts, so a deploy that
# recreates only the backend (frontend image unchanged, container kept) left
# nginx pointing at the old IP: every /api/ and /ws request got 502 until the
# frontend was restarted (prod incident 2026-11-09). `resolve` (nginx >= 1.27.3,
# needs a shared-memory zone) follows the new IP within `valid`, and nginx also
# starts when a name is not resolvable yet. Umami gets the same treatment.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend_api {
    zone backend_api 64k;
    server backend:3001 resolve;
}

upstream umami_app {
    zone umami_app 64k;
    server umami:3000 resolve;
}

# Access log without query strings: signed media URLs (?sig=), login-code /
# reset / verification tokens and the legacy websocket ?token= all travel in
# the query and must never land in container logs.
log_format main_noargs '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

# Only send "Connection: upgrade" to the backend when the client actually asked
# for a protocol upgrade; plain /api/ requests get "close" (no upstream
# keepalive pool is configured, so nothing is lost).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- SPA route allow-list (M30: no soft-404s) ---
# Paths that are neither a file nor a prerendered page get index.html (HTTP
# 200) ONLY if the React app has a route for them; every other URL answers
# with a real 404 status and the prerendered NotFound page (/404.html).
# Matching is case-insensitive because React Router's is.
#
# KEEP IN SYNC with APP_ROUTES in src/App.jsx. Public marketing pages and the
# auth shells (/login, /register, /forgot-password, /reset-password) are
# prerendered files and never reach this map. Trailing slashes are already
# 301-redirected away in "location /", so none are matched here.
map $uri $spa_known {
    default 0;

    # Therapist app
    ~*^/(dashboard|exercises|analytics|settings|subscription)$      1;
    ~*^/dashboard/guide$                                            1;
    ~*^/subscription/success$                                       1;
    ~*^/clients(/[^/]+)?$                                           1;
    ~*^/sessions/[^/]+$                                             1;
    # Admin: App.jsx has an /admin/* catch-all inside the admin shell.
    ~*^/admin(/.*)?$                                                1;

    # Public, non-prerendered routes
    ~*^/((ru|uk|es)/)?confirm$                                      1;
    ~*^/(verify-lead|verify-email)$                                 1;
    ~*^/share/supervision/[^/]+$                                    1;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_noargs;

    root /usr/share/nginx/html;
    index index.html;

    # Real 404 status + the SPA's NotFound page (prerendered at build time).
    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # --- Bot-only API: never reachable from the internet ---
    # The bot container talks to backend:3001 directly on the compose network;
    # exposing /api/bot/ publicly would leave the shared bot key as the only
    # barrier in front of every client's diary, consent and SOS endpoints.
    # Case-insensitive regex: Express routes /api/Bot/... the same as /api/bot/,
    # and a regex location beats the plain /api/ prefix below.
    location ~* ^/api/bot(/|$) {
        return 404;
    }

    # --- Backend API proxy ---
    location /api/ {
        # Session recordings and bulk imports are up to 100 MB (multer limit);
        # nginx's 1 MB default would 413 them. Stream the body to the backend
        # instead of spooling it to a temp file first.
        client_max_body_size 110m;
        proxy_request_buffering off;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- WebSocket (real-time notifications, backend path '/ws') ---
    # Without this block /ws falls through to the SPA fallback and the
    # upgrade never reaches the backend.
    location = /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # The server pings clients periodically; keep idle sockets open.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # The JWT travels in ?token= — keep it out of access logs.
        access_log off;
    }

    # --- Therapist Analytics SPA page (exact /analytics) ---
    # Without this, nginx 301-redirects /analytics to /analytics/ (because the
    # Umami proxy location below ends in a slash), so a hard load or refresh
    # of the SPA page would land on Umami instead of the React app.
    location = /analytics {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # --- Umami Analytics proxy (first-party path, adblock-resistant) ---
    # Umami runs without APP_BASE_PATH, so the trailing slash on proxy_pass
    # strips the /analytics/ prefix (/analytics/script.js -> /script.js).
    # ^~ is required: without it the regex static-assets location below wins
    # for /analytics/script.js (.js suffix) and returns 404.
    location ^~ /analytics/ {
        proxy_pass http://umami_app/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Explicit SEO files (belt-and-braces, above SPA fallback) ---
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # --- Service worker + manifest (NOT hashed: must always be revalidated) ---
    # sw.js: `no-cache` so browsers pick up a new worker on the next load
    # (a stale worker would keep serving an old app shell).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # Any nginx-generated redirect must be relative: this container sits
    # behind Traefik (TLS terminated upstream), so absolute redirects would
    # point at http:// and add a downgrade hop.
    absolute_redirect off;

    # --- SPA fallback ---
    # $uri/index.html (not $uri/) serves prerendered pages directly at their
    # slash-less canonical URLs (/privacy, /ru/compare/upheal) with 200 —
    # $uri/ would trigger nginx's directory 301 to the trailing-slash URL,
    # turning every sitemap/canonical URL into a redirect.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        # Canonical URLs are slash-less (/ru, /uk/privacy — see seo/routes.mjs
        # localePathFor); the prerendered pages already serve 200 at those URLs.
        # 301 the trailing-slash duplicates onto them so both variants never
        # return 200 (GSC "Duplicate, Google chose different canonical").
        # Root "/" is excluded (.+ requires a non-empty path segment). /api/
        # and /analytics/ have their own location blocks and never reach here.
        # The first character must not be "/" or "\": "/%5Cevil.com/" would
        # otherwise redirect to "/\evil.com", which browsers read as //evil.com.
        # (\x5C is "\" — nginx's own parser would eat a literal "\\".)
        rewrite ^/([^/\x5C].*)/$ /$1 permanent;

        # Existing file or prerendered page -> serve it. Anything else goes to
        # @spa, which only answers 200 for known app routes (see $spa_known).
        try_files $uri $uri/index.html @spa;

        # index.html and every prerendered page: always revalidate (ETag makes
        # this a cheap 304) so a deploy is visible immediately and a page never
        # references hashed bundles that no longer exist.
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # --- SPA fallback for known app routes (everything else: real 404) ---
    location @spa {
        if ($spa_known = 0) {
            return 404;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # --- Hashed build output: immutable for 1 year ---
    # Vite emits /assets/<name>-<content hash>.<ext>, so a changed file always
    # gets a new URL. Only this directory may be immutable.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # --- Other static files (NOT hashed: favicon, icons, images, og-image...) ---
    # Short cache only; `immutable` here would pin stale icons/OG images for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }
}

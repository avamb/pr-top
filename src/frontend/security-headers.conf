# Security headers for SPA/HTML and static responses (finding H12).
#
# Included from the locations that serve files from /usr/share/nginx/html.
# nginx `add_header` is NOT inherited into a location that declares its own
# add_header, so every such location includes this file (and never relies on
# server-level add_header). Deliberately NOT included in /api/, /ws or
# /analytics/: the backend sets its own helmet headers there and a second CSP
# would be intersected with it.
#
# CSP is built from what the app really loads:
#   - scripts: same-origin bundle, Umami at /analytics/script.js (same origin),
#     Cloudflare Turnstile (challenges.cloudflare.com, script + iframe).
#     No executable inline scripts (JSON-LD blocks are type=application/ld+json).
#   - styles: bundle CSS + React `style=` props -> 'unsafe-inline' for styles only.
#   - fonts: self-hosted (@fontsource) -> 'self' (+ data: for inlined small fonts).
#   - images: same-origin + data: + blob: (authenticated image previews are
#     fetched and shown through object URLs).
#   - media: blob: (AudioPlayer fetches audio/video with a Bearer header and
#     plays an object URL).
#   - connect: same origin (/api, /analytics) + the same-origin websocket (/ws).
#   - worker/manifest: /sw.js and /manifest.json.
#   - Stripe: full-page redirect to checkout.stripe.com only (no Stripe.js), so
#     nothing to allow here.
# HSTS is intentionally not set: it is handled at Cloudflare/Traefik.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss://$host https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The therapist dashboard records voice notes in the browser (getUserMedia
# audio), so the microphone stays available to our own origin only.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
